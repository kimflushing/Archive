<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY PAGE</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&display=swap');


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            ellipse at top,
            #30252a 0%,
            #181517 42%,
            #0e0d0e 100%
        );

    color: #e4dfdc;

    font-family:
        "Noto Serif KR",
        serif;

    padding: 32px 18px;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =====================================================
   전체 페이지
===================================================== */

.page {
    width: min(1050px, 100%);

    margin: 0 auto;

    position: relative;

    padding: 16px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.025),
            transparent 35%
        ),
        #181517;

    border: 1px solid #68585d;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}


/* 바깥 장식 프레임 */

.page::before {
    content: "";

    position: absolute;

    inset: 7px;

    border: 1px solid #393033;

    pointer-events: none;

    z-index: 20;
}


/* 네 모서리의 작은 장식 */

.page::after {
    content: "†";

    position: absolute;

    top: 11px;
    left: 50%;

    transform: translateX(-50%);

    color: #80646d;

    background: #181517;

    padding: 0 10px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 14px;

    z-index: 21;
}


/* =====================================================
   TOP
===================================================== */

.top {
    position: relative;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 20px 25px 22px;

    border-bottom: 1px solid #514449;
}


/* 왼쪽 사이트명 */

.logo {
    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 29px;

    font-weight: 500;

    letter-spacing: .18em;

    color: #eee9e6;
}


/* 오른쪽 작은 표시 */

.top-right {
    display: flex;

    align-items: center;

    gap: 9px;
}

.dot {
    width: 7px;
    height: 7px;

    border: 1px solid #8c747b;

    transform: rotate(45deg);
}

.dot:nth-child(2) {
    background: #684852;

    border-color: #684852;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {
    position: relative;

    display: grid;

    grid-template-columns:
        300px
        minmax(250px, 1fr)
        170px;

    gap: 30px;

    padding: 42px 30px;

    border-bottom: 1px solid #514449;
}


/* =====================================================
   메인 이미지
===================================================== */

.main-image {
    height: 350px;

    position: relative;

    overflow: hidden;

    background: #0c0b0c;

    border: 1px solid #75646a;

    box-shadow:
        inset 0 0 0 5px #171416,
        inset 0 0 0 6px #3e3438;
}


/* 실제 이미지 */

.main-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    filter:
        saturate(.75)
        contrast(1.05);
}


/* 이미지 위쪽 작은 라인 */

.main-image::before {
    content: "";

    position: absolute;

    top: 13px;
    left: 13px;
    right: 13px;

    height: 1px;

    background: rgba(255,255,255,.25);

    z-index: 2;
}


/* 이미지 번호 */

.image-number {
    position: absolute;

    right: 14px;
    bottom: 12px;

    padding: 2px 5px;

    background: rgba(10,8,9,.7);

    color: #d2c4c6;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 12px;

    letter-spacing: .08em;

    z-index: 3;
}


/* =====================================================
   PROFILE TEXT
===================================================== */

.profile-info {
    padding-top: 4px;
}


/* 작은 제목 */

.small-title {
    margin-bottom: 10px;

    color: #997983;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 11px;

    letter-spacing: .28em;
}


/* 이름 */

.name {
    margin-bottom: 21px;

    color: #eee9e7;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(48px, 6vw, 76px);

    font-weight: 400;

    line-height: .82;

    letter-spacing: -.02em;
}


/* 이름 밑 선 */

.profile-line {
    width: 100%;

    height: 1px;

    margin-bottom: 21px;

    background:
        linear-gradient(
            to right,
            #80616a,
            #514449,
            transparent
        );
}


/* 설명 */

.profile-text {
    max-width: 390px;

    color: #aaa1a0;

    font-size: 12px;

    line-height: 2;
}


/* =====================================================
   META
===================================================== */

.profile-meta {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 8px;

    margin-top: 30px;
}

.meta-box {
    padding: 10px 11px;

    background: rgba(255,255,255,.015);

    border: 1px solid #493d41;
}

.meta-title {
    color: #82656d;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 9px;

    letter-spacing: .18em;
}

.meta-value {
    margin-top: 4px;

    color: #d5cdca;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 15px;
}


/* =====================================================
   LINKS
===================================================== */

.links {
    padding-left: 22px;

    border-left: 1px solid #514449;
}

.links-title {
    margin-bottom: 17px;

    color: #ddd5d2;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 22px;

    letter-spacing: .04em;
}


/* 링크 */

.links a {
    display: block;

    position: relative;

    padding: 10px 0;

    border-bottom: 1px solid #352d30;

    color: #aaa1a0;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 14px;

    letter-spacing: .05em;

    transition:
        color .2s,
        padding .2s;
}

.links a::before {
    content: "—";

    position: absolute;

    left: -17px;

    color: #765762;

    opacity: 0;

    transition: .2s;
}

.links a:hover {
    padding-left: 8px;

    color: #eee8e5;
}

.links a:hover::before {
    opacity: 1;
}


/* =====================================================
   COLLECTION
===================================================== */

.collection {
    padding: 40px 30px 35px;
}


/* 제목 */

.collection-title {
    display: flex;

    align-items: center;

    gap: 18px;

    margin-bottom: 24px;
}

.collection-title h2 {
    color: #e5dfdc;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 27px;

    font-weight: 400;

    letter-spacing: .05em;
}

.collection-title span {
    flex: 1;

    height: 1px;

    background:
        linear-gradient(
            to right,
            #57484d,
            transparent
        );
}


/* =====================================================
   DREAM / OC
===================================================== */

.category-grid {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 16px;
}


/* 카드 */

.category {
    min-height: 205px;

    position: relative;

    overflow: hidden;

    padding: 27px;

    background:
        linear-gradient(
            135deg,
            rgba(121,82,94,.08),
            transparent 55%
        ),
        #1b1819;

    border: 1px solid #584a4f;

    transition:
        transform .3s,
        border-color .3s,
        background .3s;
}

.category:hover {
    transform: translateY(-5px);

    border-color: #8b6c76;

    background:
        linear-gradient(
            135deg,
            rgba(121,82,94,.13),
            transparent 60%
        ),
        #1e1a1c;
}


/* 큰 숫자 */

.category::after {
    content: attr(data-number);

    position: absolute;

    right: 12px;
    bottom: -38px;

    color: rgba(153,112,124,.07);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 150px;

    line-height: 1;
}


/* 작은 번호 */

.category small {
    position: relative;

    z-index: 2;

    color: #80636c;

    font-family:
        "Cormorant Garamond",
