<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY PAGE</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@300;400;500&display=swap');


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background: #171717;
    color: #e8e5e3;

    font-family:
        "Noto Serif KR",
        serif;

    padding: 35px 20px;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    width: min(1000px, 100%);
    margin: 0 auto;

    position: relative;

    padding: 18px;

    background: #1d1d1d;

    border: 1px solid #686563;
}

.page::before {
    content: "";

    position: absolute;

    inset: 7px;

    border: 1px solid #3f3f3f;

    pointer-events: none;
}


/* =====================================================
   TOP
===================================================== */

.top {
    position: relative;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 12px 18px 22px;

    border-bottom: 1px solid #555;
}

.logo {
    font-family: "Cormorant Garamond", serif;

    font-size: 30px;
    letter-spacing: .15em;

    color: #f0eeeb;
}

.top-right {
    display: flex;
    gap: 7px;
}

.dot {
    width: 10px;
    height: 10px;

    border: 1px solid #aaa;
    border-radius: 50%;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {
    position: relative;

    display: grid;

    grid-template-columns: 300px 1fr 180px;

    gap: 25px;

    padding: 35px 25px;

    border-bottom: 1px solid #555;
}


/* =====================================================
   MAIN IMAGE
===================================================== */

.main-image {
    height: 330px;

    position: relative;

    overflow: hidden;

    background: #111;

    border: 1px solid #777;
}

.main-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.image-number {
    position: absolute;

    right: 12px;
    bottom: 10px;

    font-family: "Cormorant Garamond", serif;

    font-size: 13px;

    color: #aaa;

    text-shadow:
        0 1px 3px #000;
}


/* =====================================================
   PROFILE INFO
===================================================== */

.profile-info {
    padding-top: 8px;
}

.small-title {
    margin-bottom: 8px;

    color: #999;

    font-family: "Cormorant Garamond", serif;

    font-size: 12px;

    letter-spacing: .22em;
}

.name {
    margin-bottom: 18px;

    font-family: "Cormorant Garamond", serif;

    font-size: clamp(42px, 6vw, 65px);

    font-weight: 400;

    line-height: .9;
}

.profile-line {
    width: 100%;
    height: 1px;

    margin-bottom: 20px;

    background: #555;
}

.profile-text {
    max-width: 390px;

    color: #c3c0be;

    font-size: 13px;

    line-height: 2;
}


/* =====================================================
   META
===================================================== */

.profile-meta {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 28px;
}

.meta-box {
    padding: 9px 10px;

    border: 1px solid #555;
}

.meta-title {
    color: #888;

    font-family: "Cormorant Garamond", serif;

    font-size: 10px;

    letter-spacing: .12em;
}

.meta-value {
    margin-top: 3px;

    font-size: 11px;
}


/* =====================================================
   LINKS
===================================================== */

.links {
    padding-left: 20px;

    border-left: 1px solid #555;
}

.links-title {
    margin-bottom: 15px;

    font-family: "Cormorant Garamond", serif;

    font-size: 23px;
}

.links a {
    display: block;

    padding: 8px 0;

    border-bottom: 1px solid #444;

    color: #d9d5d2;

    font-family: "Cormorant Garamond", serif;

    font-size: 14px;

    transition: .2s;
}

.links a:hover {
    padding-left: 8px;

    color: #fff;
}


/* =====================================================
   COLLECTION
===================================================== */

.collection {
    padding: 35px 25px 30px;
}

.collection-title {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.collection-title h2 {
    font-family: "Cormorant Garamond", serif;

    font-size: 28px;

    font-weight: 400;
}

.collection-title span {
    flex: 1;

    height: 1px;

    background: #555;
}


/* =====================================================
   DREAM / OC PAIR
===================================================== */

.category-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.category {
    min-height: 190px;

    position: relative;

    overflow: hidden;

    padding: 25px;

    background: #202020;

    border: 1px solid #666;

    transition:
        transform .25s,
        border-color .25s;
}

.category:hover {
    transform: translateY(-4px);

    border-color: #aaa;
}

.category::after {
    content: attr(data-number);

    position: absolute;

    right: 15px;
    bottom: -25px;

    color: rgba(255,255,255,.035);

    font-family: "Cormorant Garamond", serif;

    font-size: 130px;

    line-height: 1;
}

.category small {
    position: relative;
    z-index: 2;

    color: #999;

    font-family: "Cormorant Garamond", serif;

    font-size: 11px;

    letter-spacing: .15em;
}

.category h3 {
    position: relative;
    z-index: 2;

    margin-top: 20px;

    font-family: "Cormorant Garamond", serif;

    font-size: 46px;

    font-weight: 400;
}

.category p {
    position: relative;
    z-index: 2;

    margin-top: 5px;

    color: #999;

    font-size: 11px;
}


/* =====================================================
   FOOTER
===================================================== */

.bottom {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 20px 25px 12px;

    color: #777;

    font-family: "Cormorant Garamond", serif;

    font-size: 11px;

    letter-spacing: .08em;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 750px) {

    body {
        padding: 12px 8px;
    }

    .page {
        padding: 10px;
    }

    .profile {
        grid-template-columns: 1fr;

        gap: 25px;

        padding: 25px 15px;
    }

    .main-image {
        height: min(90vw, 400px);
    }

    .links {
        padding-left: 0;
        padding-top: 20px;

        border-left: none;
        border-top: 1px solid #555;
    }

    .category-grid {
        grid-template-columns: 1fr;
    }

    .collection {
        padding: 30px 15px;
    }

    .bottom {
        padding-right: 15px;
        padding-left: 15px;
    }

}

</style>
</head>


<body>


<div class="page">


    <!-- =========================================
         TOP
    ========================================== -->

    <header class="top">

        <div class="logo">
            MY PAGE
        </div>

        <div class="top-right">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    </header>



    <!-- =========================================
         PROFILE
    ========================================== -->

    <section class="profile">


        <!-- =====================================
             메인 이미지

             index.html과 같은 위치에
             main.jpg를 넣으면 자동으로 표시됨
        ====================================== -->

        <div class="main-image">

            <img
                src="main.jpg"
                alt="main image"
            >

            <span class="image-number">
                01
            </span>

        </div>



        <!-- =====================================
             이름 / 소개
        ====================================== -->

        <div class="profile-info">

            <p class="small-title">
                PROFILE
            </p>

            <h1 class="name">
                YOUR<br>
                NAME
            </h1>

            <div class="profile-line"></div>

            <p class="profile-text">
                여기에 원하는 내용을 적어주세요.
            </p>


            <div class="profile-meta">


                <div class="meta-box">

                    <p class="meta-title">
                        DREAM
                    </p>

                    <p class="meta-value">
                        00
                    </p>

                </div>


                <div class="meta-box">

                    <p class="meta-title">
                        OC PAIR
                    </p>

                    <p class="meta-value">
                        00
                    </p>

                </div>


            </div>

        </div>



        <!-- =====================================
             LINKS
        ====================================== -->

        <nav class="links">

            <p class="links-title">
                LINKS
            </p>

            <a href="index.html">
                HOME
            </a>

            <a href="dream.html">
                DREAM
            </a>

            <a href="oc.html">
                OC PAIR
            </a>

        </nav>


    </section>



    <!-- =========================================
         COLLECTION
    ========================================== -->

    <section class="collection">


        <div class="collection-title">

            <h2>
                COLLECTION
            </h2>

            <span></span>

        </div>



        <div class="category-grid">


            <!-- =================================
                 DREAM
            ================================== -->

            <a
                href="dream.html"
                class="category"
                data-number="01"
            >

                <small>
                    01 / COLLECTION
                </small>

                <h3>
                    DREAM
                </h3>

                <p>
                    dream
                </p>

            </a>



            <!-- =================================
                 OC PAIR
            ================================== -->

            <a
                href="oc.html"
                class="category"
                data-number="02"
            >

                <small>
                    02 / COLLECTION
                </small>

                <h3>
                    OC PAIR
                </h3>

                <p>
                    original characters
                </p>

            </a>


        </div>

    </section>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="bottom">

        <span>
            20XX
        </span>

        <span>
            © YOUR NAME
        </span>

    </footer>


</div>


</body>
</html>
