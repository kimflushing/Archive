<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY PAGE</title>

<style>

/* =========================================
   기본
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #080608;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(116, 37, 72, 0.28),
            transparent 38%
        ),
        #080608;

    color: #e8dfe4;

    padding: 25px 15px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================
   전체 프레임
========================================= */

.page {
    width: min(980px, 100%);

    margin: auto;

    position: relative;

    padding: 13px;

    background: #0d0a0d;

    border: 1px solid rgba(217, 119, 157, 0.55);

    box-shadow:
        0 0 45px rgba(125, 28, 70, 0.12);
}


/* 얇은 안쪽 프레임 */

.page::before {
    content: "";

    position: absolute;

    inset: 6px;

    border: 1px solid rgba(226, 158, 184, 0.18);

    pointer-events: none;
}


/* =========================================
   HEADER
========================================= */

.top {
    position: relative;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 22px 25px;

    border-bottom:
        1px solid
        rgba(226, 158, 184, 0.3);
}

.logo {
    color: #eadce2;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: normal;

    letter-spacing: 0.18em;
}


/* 타자기 느낌 */

.type {
    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 10px;

    letter-spacing: 0.16em;

    color: #9c687c;
}


/* =========================================
   MAIN PROFILE
========================================= */

.profile {
    position: relative;

    display: grid;

    grid-template-columns:
        280px
        1fr
        150px;

    gap: 28px;

    padding: 38px 28px;

    border-bottom:
        1px solid
        rgba(226, 158, 184, 0.3);
}


/* =========================================
   IMAGE
========================================= */

.main-image {
    width: 100%;
    height: 350px;

    position: relative;

    overflow: hidden;

    background: #050405;

    border:
        1px solid
        rgba(230, 153, 181, 0.55);

    padding: 6px;
}


/* 실제 이미지 */

.main-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    /* 이미지 자체는 흐리게 하지 않음 */
    filter: none;
}


/* 이미지 주변 핑크빛 */

.main-image::after {
    content: "";

    position: absolute;

    inset: 6px;

    pointer-events: none;

    box-shadow:
        inset 0 0 25px
        rgba(255, 90, 145, 0.10);
}


/* 번호 */

.image-number {
    position: absolute;

    right: 12px;
    bottom: 12px;

    padding: 3px 6px;

    background: rgba(0,0,0,0.75);

    color: #d88da8;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;

    letter-spacing: 0.1em;
}


/* =========================================
   PROFILE TEXT
========================================= */

.profile-info {
    padding-top: 5px;
}

.small-title {
    margin-bottom: 12px;

    color: #c56d91;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 0.18em;
}


/* 이름 */

.name {
    margin-bottom: 22px;

    color: #eee5e9;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(45px, 6vw, 70px);

    font-weight: normal;

    line-height: 0.86;

    text-shadow:
        0 0 18px
        rgba(207, 71, 120, 0.18);
}


/* 핑크 선 */

.profile-line {
    width: 100%;

    height: 1px;

    margin-bottom: 20px;

    background:
        linear-gradient(
            to right,
            rgba(221, 110, 151, 0.65),
            rgba(221, 110, 151, 0.12),
            transparent
        );
}


/* 소개 */

.profile-text {
    max-width: 380px;

    color: #a999a0;

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;

    line-height: 1.9;
}


/* =========================================
   META
========================================= */

.profile-meta {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 8px;

    margin-top: 28px;
}

.meta-box {
    padding: 10px;

    border:
        1px solid
        rgba(219, 127, 157, 0.28);

    background:
        rgba(197, 67, 112, 0.035);
}

.meta-title {
    color: #8e536b;

    font-family:
        "Courier New",
        monospace;

    font-size: 8px;

    letter-spacing: 0.13em;
}

.meta-value {
    margin-top: 5px;

    color: #d9cbd1;

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;
}


/* =========================================
   LINKS
========================================= */

.links {
    padding-left: 20px;

    border-left:
        1px solid
        rgba(226, 158, 184, 0.25);
}

.links-title {
    margin-bottom: 14px;

    color: #dfc8d1;

    font-family:
        Georgia,
        serif;

    font-size: 21px;
}

.links a {
    display: block;

    padding: 9px 0;

    border-bottom:
        1px solid
        rgba(226, 158, 184, 0.12);

    color: #a88c98;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 0.08em;

    transition: 0.2s;
}

.links a:hover {
    color: #f0a5c1;

    padding-left: 5px;
}


/* =========================================
   COLLECTION
========================================= */

.collection {
    padding: 38px 28px 32px;
}

.collection-title {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 22px;
}

.collection-title h2 {
    color: #e1d5da;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: normal;
}

.collection-title span {
    flex: 1;

    height: 1px;

    background:
        linear-gradient(
            to right,
            rgba(215, 110, 149, 0.35),
            transparent
        );
}


/* =========================================
   CATEGORY
========================================= */

.category-grid {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 14px;
}

.category {
    min-height: 190px;

    position: relative;

    overflow: hidden;

    padding: 25px;

    background:
        radial-gradient(
            circle at 80% 30%,
            rgba(158, 46, 91, 0.13),
            transparent 40%
        ),
        #100c10;

    border:
        1px solid
        rgba(220, 135, 164, 0.38);

    transition:
        border-color .25s,
        transform .25s;
}

.category:hover {
    transform: translateY(-3px);

    border-color:
        rgba(241, 151, 182, 0.7);
}


/* 작은 번호 */

.category small {
    color: #a35f79;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;

    letter-spacing: 0.14em;
}


/* 큰 제목 */

.category h3 {
    margin-top: 23px;

    color: #e9dfe4;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 46px;

    font-weight: normal;

    text-shadow:
        0 0 20px
        rgba(207, 63, 116, 0.16);
}


/* 작은 설명 */

.category p {
    margin-top: 5px;

    color: #765e68;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;
}


/* 큰 배경 숫자 */

.category::after {
    content: attr(data-number);

    position: absolute;

    right: 12px;
    bottom: -45px;

    color:
        rgba(206, 76, 126, 0.045);

    font-family:
        Georgia,
        serif;

    font-size: 150px;

    line-height: 1;

    pointer-events: none;
}


/* =========================================
   FOOTER
========================================= */

.bottom {
    display: flex;

    justify-content: space-between;

    padding: 18px 28px 12px;

    border-top:
        1px solid
        rgba(226, 158, 184, 0.14);

    color: #654d58;

    font-family:
        "Courier New",
        monospace;

    font-size: 8px;

    letter-spacing: 0.12em;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 750px) {

    body {
        padding: 8px;
    }

    .page {
        padding: 9px;
    }

    .top {
        padding:
            20px
            15px;
    }

    .logo {
        font-size: 22px;
    }

    .profile {
        grid-template-columns: 1fr;

        gap: 25px;

        padding:
            28px
            15px;
    }

    .main-image {
        height: min(110vw, 430px);
    }

    .links {
        padding:
            20px
            0
            0;

        border-left: none;

        border-top:
            1px solid
            rgba(226, 158, 184, 0.25);
    }

    .collection {
        padding:
            30px
            15px;
    }

    .category-grid {
        grid-template-columns: 1fr;
    }

    .category {
        min-height: 170px;
    }

    .category h3 {
        font-size: 40px;
    }

    .bottom {
        padding:
            16px
            15px
            10px;
    }
}

</style>
</head>


<body>


<div class="page">


    <!-- ===============================

        <nav class="links">

</div>


</body>
</html>
