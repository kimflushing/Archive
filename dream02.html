<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dream02.html</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Patrick+Hand&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 20% 20%, rgba(247,200,194,.18), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(220,190,230,.15), transparent 25%),
        #fffafb;
    color: #806f75;
    font-family: "Nunito", sans-serif;
    overflow-x: hidden;
}

/* -------------------------
   BACKGROUND DECORATION
------------------------- */

.bg-symbol {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    color: #efc6cc;
    opacity: .55;
    font-family: "Patrick Hand", cursive;
    animation: float 7s ease-in-out infinite;
}

.s1 { left: 7%; top: 12%; font-size: 18px; animation-delay: 0s; }
.s2 { left: 88%; top: 18%; font-size: 13px; animation-delay: 1.5s; }
.s3 { left: 15%; top: 80%; font-size: 12px; animation-delay: 3s; }
.s4 { left: 91%; top: 72%; font-size: 20px; animation-delay: 4s; }
.s5 { left: 47%; top: 8%; font-size: 11px; animation-delay: 2s; }
.s6 { left: 55%; top: 91%; font-size: 15px; animation-delay: 5s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-10px) rotate(4deg);
    }
}

/* -------------------------
   DESKTOP WINDOW
------------------------- */

.window-wrap {
    position: relative;
    z-index: 2;
    width: 680px;
    margin: 55px auto;
}

.window {
    width: 680px;
    min-height: 720px;
    background: rgba(255, 250, 251, .97);
    border: 1px solid #d9b8bf;
    box-shadow:
        0 0 0 4px rgba(255,255,255,.85),
        0 8px 30px rgba(130, 85, 100, .13);
}

/* -------------------------
   TITLE BAR
------------------------- */

.titlebar {
    height: 30px;
    border-bottom: 1px solid #dfc3c8;
    background: #f7e4e7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px;
    color: #987980;
    font-size: 11px;
}

.title-left {
    display: flex;
    align-items: center;
    gap: 7px;
}

.window-icon {
    width: 13px;
    height: 13px;
    border: 1px solid #c997a2;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    color: #d28f9e;
}

.window-buttons {
    display: flex;
    gap: 4px;
}

.window-button {
    width: 16px;
    height: 14px;
    border: 1px solid #d4afb7;
    background: #fff8f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
}

/* -------------------------
   HEADER
------------------------- */

.header {
    padding: 17px 19px 13px;
    border-bottom: 1px solid #ead5d9;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.logo {
    color: #b77d8c;
    font-family: "Patrick Hand", cursive;
    font-size: 25px;
    line-height: 1;
    letter-spacing: .5px;
}

.logo-sub {
    font-size: 9px;
    color: #bba3a9;
    letter-spacing: 1px;
    margin-top: 5px;
}

.status {
    font-size: 9px;
    color: #b99aa2;
    text-align: right;
}

.status b {
    color: #d08e9d;
}

/* -------------------------
   MINI NAV
------------------------- */

.mini-nav {
    display: flex;
    gap: 5px;
    margin-top: 13px;
}

.mini-nav span {
    border: 1px solid #e2c8cd;
    background: #fff;
    padding: 4px 8px;
    font-size: 9px;
    color: #9e858c;
}

.mini-nav span:first-child {
    background: #fbecef;
    color: #bd7e8d;
}

/* -------------------------
   MAIN AREA
------------------------- */

.page {
    padding: 15px;
}

.intro {
    border: 1px solid #e1c7cc;
    background: #fff;
    padding: 10px 12px;
    margin-bottom: 12px;
}

.intro-title {
    font-family: "Patrick Hand", cursive;
    color: #b77b8a;
    font-size: 17px;
}

.intro-text {
    font-size: 10px;
    line-height: 1.8;
    color: #9b858b;
    margin-top: 3px;
}

/* -------------------------
   CONTENT WINDOW
------------------------- */

.content-window {
    border: 1px solid #dcbfc5;
    background: #fff;
}

.content-title {
    height: 25px;
    border-bottom: 1px solid #e2cdd1;
    background: #fdf0f2;
    padding: 5px 9px;
    font-size: 9px;
    color: #a87b84;
}

/* -------------------------
   TABS
------------------------- */

.tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    border-bottom: 1px solid #dfc5ca;
    background: #fffafa;
}

.tab {
    border: 0;
    border-right: 1px solid #e3cdd1;
    padding: 8px 2px;
    background: #fffafa;
    color: #a98b92;
    font-family: "Nunito", sans-serif;
    font-size: 9px;
    cursor: pointer;
    transition: .15s ease;
}

.tab:last-child {
    border-right: 0;
}

.tab:hover {
    background: #fdf0f2;
    color: #bd7f8d;
}

.tab.active {
    background: #f8dfe4;
    color: #a96778;
    font-weight: 700;
}

/* -------------------------
   TAB CONTENT
------------------------- */

.tab-content {
    display: none;
    padding: 14px;
}

.tab-content.active {
    display: block;
}

/* -------------------------
   MAIN
------------------------- */

.main-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 12px;
}

.main-image {
    width: 100%;
    height: 340px;
    object-fit: cover;
    object-position: center;
    border: 1px solid #ddc0c6;
    background: #f9eeee;
}

.main-note {
    border: 1px solid #e3ccd0;
    padding: 10px;
    margin-top: 8px;
    background: #fffafa;
    font-size: 9px;
    line-height: 1.8;
}

.main-side {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.info-box {
    border: 1px solid #e2cbd0;
    background: #fff;
    padding: 10px;
}

.info-title {
    color: #b67584;
    font-family: "Patrick Hand", cursive;
    font-size: 16px;
    margin-bottom: 5px;
}

.info-text {
    font-size: 9px;
    line-height: 1.8;
    color: #968087;
}

/* -------------------------
   OC / CANON
------------------------- */

.character-layout {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 13px;
}

.character-image {
    width: 190px;
    height: 300px;
    object-fit: contain;
    object-position: center bottom;
    border: 1px solid #dec3c8;
    background: #fffafa;
}

.character-info {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.small-box {
    border: 1px solid #e2ccd0;
    padding: 9px;
    background: #fff;
}

.small-title {
    font-size: 9px;
    letter-spacing: 1px;
    color: #b87987;
    font-weight: 700;
    margin-bottom: 4px;
}

.small-text {
    font-size: 9px;
    line-height: 1.8;
    color: #958087;
}

/* -------------------------
   WORLD
------------------------- */

.world-box {
    border: 1px solid #e1c9ce;
    background: #fff;
    padding: 12px;
    margin-bottom: 9px;
}

.world-box:last-child {
    margin-bottom: 0;
}

.world-title {
    font-family: "Patrick Hand", cursive;
    color: #b67685;
    font-size: 17px;
    margin-bottom: 4px;
}

.world-text {
    font-size: 9px;
    line-height: 1.9;
    color: #958087;
}

/* -------------------------
   RELATIONSHIP
------------------------- */

.relationship {
    border: 1px solid #dfc5ca;
    background: #fff;
    padding: 15px;
}

.relationship-title {
    text-align: center;
    color: #b16f80;
    font-family: "Patrick Hand", cursive;
    font-size: 22px;
    margin-bottom: 10px;
}

.relationship-line {
    width: 80px;
    height: 1px;
    background: #e4c7cc;
    margin: 0 auto 13px;
}

.relationship-text {
    font-size: 10px;
    line-height: 2;
    color: #8f777f;
}

.relationship-text strong {
    color: #b16d7d;
}

.relationship-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 13px;
}

.relationship-tags span {
    border: 1px solid #e3c7cc;
    background: #fff7f8;
    padding: 4px 7px;
    font-size: 8px;
    color: #b17d88;
}

/* -------------------------
   COMMISSION
------------------------- */

.commission-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.commission-item {
    position: relative;
    border: 1px solid #dec4c9;
    background: #fff;
    padding: 4px;
    cursor: pointer;
    transition: .15s ease;
}

.commission-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(150,100,110,.12);
}

.commission-item img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    display: block;
}

.commission-number {
    font-size: 8px;
    color: #ad8990;
    text-align: center;
    padding: 4px 0 1px;
}

/* -------------------------
   FOOTER
------------------------- */

.footer {
    border-top: 1px solid #e2cdd1;
    margin-top: 14px;
    padding: 10px 2px 2px;
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: #b39ba1;
}

.home-link {
    color: #b06f80;
    text-decoration: none;
}

.home-link:hover {
    text-decoration: underline;
}

/* -------------------------
   LIGHTBOX
------------------------- */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(80,50,60,.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.lightbox.show {
    display: flex;
}

.lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    object-fit: contain;
    border: 5px solid white;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.close-lightbox {
    position: fixed;
    top: 18px;
    right: 22px;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

/* -------------------------
   MOBILE
------------------------- */

@media (max-width: 700px) {

    body {
        overflow-x: hidden;
    }

    .window-wrap {
        width: 680px;
        margin: 25px auto;
        transform-origin: top center;
    }

    .window {
        width: 680px;
    }

}
</style>
</head>

    <div class="titlebar">
