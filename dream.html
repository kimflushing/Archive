<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DREAM</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #080608;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(116, 37, 72, 0.28),
            transparent 38%
        ),
        #080608;

    color: #e8dfe4;

    padding: 25px 15px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

a {
    color: inherit;
    text-decoration: none;
}


/* ================================
   전체 프레임
================================ */

.page {
    width: min(980px, 100%);
    min-height: calc(100vh - 50px);

    margin: auto;

    position: relative;

    padding: 13px;

    background: #0d0a0d;

    border: 1px solid rgba(217, 119, 157, 0.55);

    box-shadow:
        0 0 45px rgba(125, 28, 70, 0.12);
}

.page::before {
    content: "";

    position: absolute;

    inset: 6px;

    border: 1px solid rgba(226, 158, 184, 0.18);

    pointer-events: none;
}


/* ================================
   HEADER
================================ */

.top {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 22px 25px;

    border-bottom:
        1px solid
        rgba(226, 158, 184, 0.3);
}

.logo {
    font-size: 25px;

    font-weight: normal;

    letter-spacing: 0.18em;

    color: #eadce2;
}

.type {
    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 10px;

    letter-spacing: 0.16em;

    color: #9c687c;
}


/* ================================
   TITLE
================================ */

.title-area {
    padding: 55px 35px 35px;

    text-align: center;
}

.title-area h1 {
    font-size: 42px;

    font-weight: normal;

    letter-spacing: 0.18em;

    color: #eee2e7;

    text-shadow:
        0 0 18px rgba(217, 119, 157, 0.22);
}

.title-area p {
    margin-top: 13px;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 10px;

    letter-spacing: 0.2em;

    color: #8e6877;
}


/* ================================
   DREAM LIST
================================ */

.dream-list {

    padding: 15px 35px 60px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}


/* ================================
   DREAM CARD
================================ */

.dream-card {

    position: relative;

    min-height: 250px;

    padding: 8px;

    border:
        1px solid
        rgba(217, 119, 157, 0.42);

    background: #100c10;

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
}

.dream-card:hover {

    transform: translateY(-3px);

    border-color:
        rgba(238, 150, 183, 0.75);

    box-shadow:
        0 0 25px
        rgba(160, 43, 91, 0.2);
}


/* 이미지 */

.dream-image {

    width: 100%;

    height: 175px;

    overflow: hidden;

    border:
        1px solid
        rgba(226, 158, 184, 0.22);

    background: #080608;
}

.dream-image img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    filter: none;
}


/* 카드 글 */

.dream-info {

    padding: 14px 10px 9px;

    display: flex;

    justify-content: space-between;

    align-items: flex-end;
}

.dream-name {

    font-size: 18px;

    font-weight: normal;

    letter-spacing: 0.08em;

    color: #e8dce2;
}

.dream-number {

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 9px;

    letter-spacing: 0.12em;

    color: #8e6877;
}


/* 설명 */

.dream-description {

    padding:
        0 10px 10px;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 9px;

    line-height: 1.7;

    letter-spacing: 0.05em;

    color: #866875;
}


/* ================================
   하단
================================ */

.bottom {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding:
        20px 25px;

    border-top:
        1px solid
        rgba(226, 158, 184, 0.25);
}

.back {

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 10px;

    letter-spacing: 0.12em;

    color: #9c687c;

    transition: color 0.2s ease;
}

.back:hover {
    color: #e5a1ba;
}

.footer {

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 8px;

    letter-spacing: 0.1em;

    color: #624955;
}


/* ================================
   모바일
================================ */

@media (max-width: 750px) {

    body {
        padding: 12px 8px;
    }

    .page {
        min-height: calc(100vh - 24px);
    }

    .top {
        padding: 18px 17px;
    }

    .logo {
        font-size: 19px;
    }

    .type {
        font-size: 8px;
    }

    .title-area {
        padding:
            42px 20px 25px;
    }

    .title-area h1 {
        font-size: 30px;
    }

    .dream-list {
        padding:
            10px 15px 40px;

        grid-template-columns:
            1fr;
    }

    .dream-card {
        min-height: 0;
    }

    .dream-image {
        height: 190px;
    }

    .bottom {
        padding:
            17px;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header class="top">

        <a href="index.html" class="logo">
            MY PAGE
        </a>

        <div class="type">
            DREAM / 01
        </div>

    </header>


    <!-- TITLE -->

    <section class="title-area">

        <h1>DREAM</h1>

        <p>

        </p>

    </section>


    <!-- DREAM LIST -->

    <main class="dream-list">


        <!-- DREAM 01 -->

        <a href="dream01.html" class="dream-card">

            <div class="dream-image">

                <!-- 여기에 첫 번째 드림 이미지 -->

                <img
                    src="dream01.JPG"

                >

            </div>


            <div class="dream-info">

                <div class="dream-name">

                </div>

                <div class="dream-number">

            </div>


            <div class="dream-description">

            </div>

        </a>



        <!-- DREAM 02 -->

        <a href="dream02.html" class="dream-card">

            <div class="dream-image">

                <!-- 여기에 두 번째 드림 이미지 -->

                <img
                    src="dream02.JPG"
                    alt="Dream 02"
                >

            </div>


            <div class="dream-info">

                <div class="dream-name">
                    DREAM 02
                </div>

                <div class="dream-number">

                </div>

            </div>


            <div class="dream-description">
                CHARACTER × DREAM
            </div>

        </a>



        <!-- DREAM 03 -->

        <a href="dream03.html" class="dream-card">

            <div class="dream-image">

                <!-- 여기에 세 번째 드림 이미지 -->

                <img
                    src="dream03.JPG"
                    alt="Dream 03"
                >

            </div>


            <div class="dream-info">

                <div class="dream-name">
                    DREAM 03
                </div>

                <div class="dream-number">
                    003
                </div>

            </div>


            <div class="dream-description">
                CHARACTER × DREAM
            </div>

        </a>



        <!-- DREAM 04 -->

        <a href="dream04.html" class="dream-card">

            <div class="dream-image">

                <!-- 여기에 네 번째 드림 이미지 -->

                <img
                    src="dream04.JPG"
                    alt="Dream 04"
                >

            </div>


            <div class="dream-info">

                <div class="dream-name">
                    DREAM 04
                </div>

                <div class="dream-number">
                    004
                </div>

            </div>


            <div class="dream-description">
                CHARACTER × DREAM
            </div>

        </a>


    </main>


    <!-- BOTTOM -->

    <footer class="bottom">

        <a href="index.html" class="back">
            ← BACK
        </a>

        <div class="footer">
            DREAM COLLECTION
        </div>

    </footer>


</div>

</body>
</html>
